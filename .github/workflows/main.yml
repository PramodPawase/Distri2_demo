name: Build and Deploy .NET App

on:
  push:
    branches:
      - main   # Trigger only on push to main branch
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # 3. Cache NuGet packages (speeds up builds)
      - name: Cache NuGet
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 4. Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # 5. Build project
      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      # 6. Run tests
      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # 7. Publish project
      - name: Publish Project
        run: dotnet publish -c Release -o ./publish

      # 8. Upload artifact (optional, useful for debugging)
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: published-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build   # Run only after build succeeds
    environment: production

    steps:
      # 1. Download published artifact
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: published-app
          path: ./publish

      # 2. Deploy via FTP/SFTP
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps   # or sftp depending on your hosting setup
          local-dir: ./publish
          server-dir: /httpdocs   # Adjust to your hosting root folder
          dangerous-clean-slate: true   # Ensures old files are removed
